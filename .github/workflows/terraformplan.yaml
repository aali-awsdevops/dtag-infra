name: dtag-infra-initial-setup

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.15.0"

jobs:

  # ==================================================
  # Terraform Init
  # ==================================================
  terraform-setup:
    name: Terraform Init
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: s3
        run: |
          terraform init -backend=false


  # ==================================================
  # Terraform Format
  # ==================================================
  terraform-format:
    name: Terraform Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: s3
        run: |
          terraform fmt -check -diff


  # ==================================================
  # Terraform Validate
  # ==================================================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    needs:


      - terraform-setup
      - terraform-format

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: s3
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        working-directory: s3
        run: |
          terraform validate


  # ==================================================
  # Terraform Plan
  # ==================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    needs:
      - terraform-validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::472387458319:role/dtag-githbactions-plan
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: s3
        run: |
          terraform init

      - name: Terraform Plan
        working-directory: s3
        run: |
          terraform plan