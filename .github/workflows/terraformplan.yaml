name: dtag-infra-initial-setup

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.15.0"

jobs:

  # ==================================================
  # Terraform Init
  # ==================================================
  terraform-setup:
    name: Terraform Init
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: vpc
        run: |
          terraform init -backend=false


  # ==================================================
  # Terraform Format
  # ==================================================
  terraform-format:
    name: Terraform Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: vpc
        run: |
          terraform fmt


  # ==================================================
  # Terraform Validate
  # ==================================================
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    needs:


      - terraform-setup
      - terraform-format

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: vpc
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        working-directory: vpc
        run: |
          terraform validate


  # ==================================================
  # Terraform Plan
  # ==================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    needs:
      - terraform-validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6
       # ----------------------------------------------
      # Check GitHub OIDC claims
      # ----------------------------------------------
      - name: Check GitHub OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log("======================================");
            console.log("GitHub OIDC Information");
            console.log("======================================");
            console.log("Repository : " + payload.repository);
            console.log("Subject    : " + payload.sub);
            console.log("Audience   : " + payload.aud);
            console.log("Issuer     : " + payload.iss);
            console.log("======================================");


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::472387458319:role/dtag-githbactions-plan
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: vpc
        run: |
          terraform init

      - name: Terraform Plan
        working-directory: s3
        run: |
          terraform plan
